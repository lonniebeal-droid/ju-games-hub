<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>A-TOWN LIFE</title><style>body{margin:0;background:#09090f;color:#fff;font:15px system-ui}main{max-width:650px;margin:auto;padding:18px}h1{color:#ff2d95}.hud,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,button{background:#171722;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}button{text-align:left}button:hover{border-color:#ff2d95}.bar{height:7px;background:#333;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#d4af37}.log{min-height:90px}.money{color:#66f59b}</style><style>
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[role="button"],a{touch-action:manipulation}
button{min-height:44px;min-width:44px}
</style><style>
@media(max-width:700px){body{overscroll-behavior:none}button,[role="button"],a{font-size:max(16px,1em)}canvas{max-width:100%;height:auto}*{box-sizing:border-box}}
</style></head><body><main><h1>A-TOWN LIFE</h1><p>START IN EAST ATLANTA. Work, hustle, learn and keep your needs together.</p><div id=h class=hud></div><h3>What you doing?</h3><div class=actions><button onclick=act('work')>💼 Shift<br>+$90 • -Energy</button><button onclick=act('gig')>🎥 Creative Gig<br>+$55 • -Energy</button><button onclick=act('school')>📚 Class<br>+Skill • costs $20</button><button onclick=act('food')>🍗 Eat<br>+Hunger • costs $18</button><button onclick=act('rest')>🛏️ Rest<br>+Energy • time passes</button><button onclick=act('studio')>🎙️ Studio<br>+Rep • costs $35</button></div><h3>Day <span id=d>1</span></h3><div id=l class="card log">East Atlanta. $120 in your pocket. Make it work.</div><button onclick=reset()>Reset Life</button></main><script>let S;function reset(){S={day:1,money:120,energy:80,hunger:75,health:85,rep:5,skill:1,turn:0};save();draw()}function save(){localStorage.atownlife=JSON.stringify(S)}function load(){try{S=JSON.parse(localStorage.atownlife)}catch(e){}if(!S)reset();else draw()}function act(a){let msg='';if(a=='work'){S.money+=90;S.energy-=22;S.hunger-=12;msg='You finished a shift. +$90.'}if(a=='gig'){S.money+=55+S.skill*5;S.energy-=18;S.rep+=2;msg='Creative gig booked and delivered.'}if(a=='school'){if(S.money<20)return note('Need $20 for class.');S.money-=20;S.skill++;S.energy-=10;msg='Skill went up.'}if(a=='food'){if(S.money<18)return note('Need $18 to eat.');S.money-=18;S.hunger+=35;msg='Fed. Back outside.'}if(a=='rest'){S.energy+=40;S.hunger-=8;msg='You got some sleep.'}if(a=='studio'){if(S.money<35)return note('Need $35 for studio.');S.money-=35;S.rep+=5;S.energy-=8;msg='Studio session raised your rep.'}S.turn++;if(S.turn%4==0){S.day++;S.money-=25;msg+=' Daily bills hit: -$25.'}S.energy=Math.max(0,Math.min(100,S.energy));S.hunger=Math.max(0,Math.min(100,S.hunger));if(S.hunger<20||S.energy<15)S.health=Math.max(0,S.health-5);if(S.money<0)S.rep=Math.max(0,S.rep-1);save();draw();note(msg)}function note(x){l.textContent=x}function draw(){d.textContent=S.day;let a=[['Cash','$'+S.money],['Energy',S.energy],['Hunger',S.hunger],['Health',S.health],['Rep',S.rep],['Skill',S.skill]];h.innerHTML=a.map(x=>'<div class=card><b>'+x[0]+': <span class="'+(x[0]=='Cash'?'money':'')+'">'+x[1]+'</span></b>'+(typeof x[1]=='number'&&['Energy','Hunger','Health'].includes(x[0])?'<div class=bar><i style="width:'+x[1]+'%"></i></div>':'')+'</div>').join('')}load()</script><script>
(function(){
 document.addEventListener('contextmenu',e=>{if(e.target.closest('button,[role="button"],canvas'))e.preventDefault()});
 document.querySelectorAll('button,[role="button"]').forEach(el=>{
   el.setAttribute('tabindex',el.getAttribute('tabindex')||'0');
   el.addEventListener('touchend',()=>{}, {passive:true});
 });
})();
</script></body></html>
