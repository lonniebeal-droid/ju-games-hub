<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>A-TOWN LIFE</title><style>
/* A-TOWN LIFE — Atlanta night visual upgrade (graphics only; game logic untouched) */
*{box-sizing:border-box}
body{margin:0;color:#fff;font:15px system-ui,-apple-system,sans-serif;min-height:100vh;
 background:radial-gradient(900px 450px at 50% -8%,#2b1b4d 0%,#14101f 55%,#08080d 100%)}
main{max-width:650px;margin:auto;padding:18px;position:relative}
h1{font-size:2rem;letter-spacing:.1em;margin:.3em 0 .1em;
 background:linear-gradient(180deg,#ffe9a8,#d4af37 60%,#9c7a1e);-webkit-background-clip:text;background-clip:text;color:transparent;
 text-shadow:0 2px 18px #d4af3733}
main>p{color:#b9a8d9;margin:.2em 0 1em}
h3{color:#ffe9a8;letter-spacing:.06em;margin:1.1em 0 .5em}
h3 span{display:inline-block;min-width:2.2em;padding:2px 10px;border-radius:999px;
 background:linear-gradient(180deg,#3a2c5c,#241b3d);border:1px solid #d4af3755;color:#fff}
.hud,.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;padding:12px;
 backdrop-filter:blur(6px);box-shadow:0 4px 20px #0007}
.hud .card b{font-size:.85rem;letter-spacing:.03em;color:#cfc4e8}
.hud .card b span{color:#fff;font-size:1.05rem}
.money{color:#66f59b !important;text-shadow:0 0 12px #66f59b55}
.bar{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffe9a8,#d4af37);transition:width .3s ease}
.hud .card:nth-child(2) .bar i{background:linear-gradient(90deg,#ff9ecb,#ff2d95)}  /* energy */
.hud .card:nth-child(3) .bar i{background:linear-gradient(90deg,#ffc46b,#ff7a1a)}  /* hunger */
.hud .card:nth-child(4) .bar i{background:linear-gradient(90deg,#7dffb0,#22c55e)}  /* health */
button{background:linear-gradient(180deg,#2a2140,#191423);border:1px solid #ffffff26;border-radius:14px;
 padding:12px;color:#fff;text-align:left;cursor:pointer;font-size:.95rem;line-height:1.5;
 box-shadow:0 4px 16px #0007;transition:transform .08s,border-color .15s,box-shadow .15s}
button:hover{border-color:#ff2d95;box-shadow:0 4px 22px #ff2d9544}
button:active{transform:scale(.98)}
.actions button{font-size:1.6rem}
.actions button small{font-size:.85rem;color:#cfc4e8}
.log{min-height:90px;background:linear-gradient(180deg,#171226,#100c1c);border-left:3px solid #d4af37;
 font-size:.95rem;color:#e8e0f7}
main>button:last-child{margin-top:14px;background:linear-gradient(180deg,#3a2c5c,#241b3d);border-color:#d4af3755;font-weight:700}
</style><style>
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[role="button"],a{touch-action:manipulation}
button{min-height:44px;min-width:44px}
</style><style>
@media(max-width:700px){body{overscroll-behavior:none}button,[role="button"],a{font-size:max(16px,1em)}canvas{max-width:100%;height:auto}*{box-sizing:border-box}}
</style></head><body><main><h1>A-TOWN LIFE</h1><p>Start in East Atlanta. Work, hustle, learn and keep your needs together.</p><div id=h class=hud></div><h3>What you doing?</h3><div class=actions><button onclick=act('work')>💼 Shift<br><small>+$90 • -Energy</small></button><button onclick=act('gig')>🎥 Creative Gig<br><small>+$55 • -Energy</small></button><button onclick=act('school')>📚 Class<br><small>+Skill • costs $20</small></button><button onclick=act('food')>🍗 Eat<br><small>+Hunger • costs $18</small></button><button onclick=act('rest')>🛏️ Rest<br><small>+Energy • time passes</small></button><button onclick=act('studio')>🎙️ Studio<br><small>+Rep • costs $35</small></button></div><h3>Day <span id=d>1</span></h3><div id=l class="card log">East Atlanta. $120 in your pocket. Make it work.</div><button onclick=reset()>Reset Life</button></main><script>
/* ===== GAME LOGIC — preserved exactly from the original (graphics upgrade changed only CSS + minor presentational markup) ===== */
let S;function reset(){S={day:1,money:120,energy:80,hunger:75,health:85,rep:5,skill:1,turn:0};save();draw()}function save(){localStorage.atownlife=JSON.stringify(S)}function load(){try{S=JSON.parse(localStorage.atownlife)}catch(e){}if(!S)reset();else draw()}function act(a){let msg='';if(a=='work'){S.money+=90;S.energy-=22;S.hunger-=12;msg='You finished a shift. +$90.'}if(a=='gig'){S.money+=55+S.skill*5;S.energy-=18;S.rep+=2;msg='Creative gig booked and delivered.'}if(a=='school'){if(S.money<20)return note('Need $20 for class.');S.money-=20;S.skill++;S.energy-=10;msg='Skill went up.'}if(a=='food'){if(S.money<18)return note('Need $18 to eat.');S.money-=18;S.hunger+=35;msg='Fed. Back outside.'}if(a=='rest'){S.energy+=40;S.hunger-=8;msg='You got some sleep.'}if(a=='studio'){if(S.money<35)return note('Need $35 for studio.');S.money-=35;S.rep+=5;S.energy-=8;msg='Studio session raised your rep.'}S.turn++;if(S.turn%4==0){S.day++;S.money-=25;msg+=' Daily bills hit: -$25.'}S.energy=Math.max(0,Math.min(100,S.energy));S.hunger=Math.max(0,Math.min(100,S.hunger));if(S.hunger<20||S.energy<15)S.health=Math.max(0,S.health-5);if(S.money<0)S.rep=Math.max(0,S.rep-1);save();draw();note(msg)}function note(x){l.textContent=x}function draw(){d.textContent=S.day;let a=[['Cash','$'+S.money],['Energy',S.energy],['Hunger',S.hunger],['Health',S.health],['Rep',S.rep],['Skill',S.skill]];h.innerHTML=a.map(x=>'<div class=card><b>'+x[0]+': <span class="'+(x[0]=='Cash'?'money':'')+'">'+x[1]+'</span></b>'+(typeof x[1]=='number'&&['Energy','Hunger','Health'].includes(x[0])?'<div class=bar><i style="width:'+x[1]+'%"></i></div>':'')+'</div>').join('')}load()</script><script>
(function(){
 document.addEventListener('contextmenu',e=>{if(e.target.closest('button,[role="button"],canvas'))e.preventDefault()});
 document.querySelectorAll('button,[role="button"]').forEach(el=>{
   el.setAttribute('tabindex',el.getAttribute('tabindex')||'0');
   el.addEventListener('touchend',()=>{}, {passive:true});
 });
})();
</script></body></html>
