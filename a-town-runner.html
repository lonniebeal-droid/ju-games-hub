'use strict';

  LANES: 3,
  SPAWN_Z: 110,
  COLLIDE_Z: 6,
  JUMP_TIME: 0.68,
  JUMP_PEAK: 84,

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

        draws.push({ z: zz, kind: 'trainseg', o: o });

      overAt = performance.now();
    } else if (e.type === 'jump') {
      playJump();
    } else if (e.type === 'land') {
      landT = 1;
    }
  }
}
var tsx = 0, tsy = 0;
canvas.addEventListener('touchstart', function (e) {
  e.preventDefault(); ac();
  var t = e.changedTouches[0];
  tsx = t.clientX; tsy = t.clientY;
}, { passive: false });
canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  var t = e.changedTouches[0];
  var dx = t.clientX - tsx, dy = t.clientY - tsy;
  if (game.status === 'menu') { startGame(game); return; }
  if (game.status === 'over') {
    if (performance.now() - overAt > 700) startGame(game);
    return;
  }
  if (game.status === 'paused') { game.status = 'playing'; return; }
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMoveLane(game, dx > 0 ? 1 : -1);
  else if (dy < 0) { if (tryJump(game)) handleEvents([{ type: 'jump' }]); }
  else trySlide(game);
}, { passive: false });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('mousedown', function (e) {
  if (e.target !== canvas) return;
  ac();
  if (game.status === 'menu') { startGame(game); return; }
  if (game.status === 'over') {
    if (performance.now() - overAt > 700) startGame(game);
    return;
  }
  if (game.status === 'paused') { game.status = 'playing'; return; }
});
window.addEventListener('keydown', function (e) {
  ac();
  if (game.status === 'menu' && (e.key === ' ' || e.key === 'Enter')) { startGame(game); return; }
  if (game.status === 'over' && e.key === ' ') {
    if (performance.now() - overAt > 700) startGame(game);
    return;
  }
  if (game.status === 'paused' && (e.key === ' ' || e.key === 'Enter')) { game.status = 'playing'; return; }
  if (e.key === 'ArrowLeft') tryMoveLane(game, -1);
  else if (e.key === 'ArrowRight') tryMoveLane(game, 1);
  else if (e.key === 'ArrowUp') { if (tryJump(game)) handleEvents([{ type: 'jump' }]); }
  else if (e.key === 'ArrowDown') trySlide(game);
  else if (e.key === 'p' || e.key === 'P') {
    if (game.status === 'playing') game.status = 'paused';
    else if (game.status === 'paused') game.status = 'playing';
  }
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden && game.status === 'playing') game.status = 'paused';
});
/* ---- system buttons: pause + mute (mobile reachable) ---- */
var muted = false;
try { muted = localStorage.getItem('atownRunnerMuted') === '1'; } catch (e) {}
var __lastPauseIcon = '', __lastMuteIcon = '';
function syncSysBtns() {
  var mb = document.getElementById('btnMuteR');
  var pb = document.getElementById('btnPauseR');
  var mi = muted ? '🔇' : '🔊';
  var pi = (game.status === 'paused') ? '▶' : '⏸';
  if (mb && mi !== __lastMuteIcon) { mb.textContent = mi; __lastMuteIcon = mi; }
  if (pb && pi !== __lastPauseIcon) { pb.textContent = pi; __lastPauseIcon = pi; }
}
document.getElementById('btnPauseR').addEventListener('click', function (e) {
  e.stopPropagation(); ac();
  if (game.status === 'playing') game.status = 'paused';
  else if (game.status === 'paused') game.status = 'playing';
  syncSysBtns();
});
document.getElementById('btnMuteR').addEventListener('click', function (e) {
  e.stopPropagation();
  muted = !muted;
  try { localStorage.setItem('atownRunnerMuted', muted ? '1' : '0'); } catch (x) {}
  syncSysBtns();
  if (!muted) playCoin(3);
});
syncSysBtns();
/* ================= MAIN LOOP ================= */
var last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  var ev = update(game, dt);
  handleEvents(ev);
  stepParts(dt);
  render(game, dt);
  syncSysBtns();
}
requestAnimationFrame(frame);
</script>
</body>
