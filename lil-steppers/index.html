<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JU Lil Steppers: Blessing's Block Party</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#62d8ff,#fff2a8);color:#17213b;overflow:hidden}.game{height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}.top{width:min(900px,100%);display:flex;justify-content:space-between;gap:8px;font-weight:900}.pill{background:#fff;border:3px solid #17213b;border-radius:18px;padding:7px 12px;box-shadow:0 4px 0 #17213b}.stage{position:relative;width:min(900px,100%);flex:1;min-height:390px;margin-top:8px;border:4px solid #17213b;border-radius:26px;overflow:hidden;background:linear-gradient(#9be36f 0 58%,#8b6b55 58% 62%,#55b7ef 62%);box-shadow:0 7px 0 #17213b}.sky{position:absolute;inset:0;background:radial-gradient(circle at 12% 12%,#fff 0 18px,transparent 19px),radial-gradient(circle at 80% 17%,#fff 0 24px,transparent 25px)}.blessing{position:absolute;left:9%;bottom:12%;font-size:82px;filter:drop-shadow(0 5px 0 #5c3b2e);transition:.18s}.name{position:absolute;left:5%;bottom:4%;background:#fff;border:3px solid #17213b;border-radius:14px;padding:5px 10px;font-weight:1000}.target{position:absolute;font-size:52px;cursor:pointer;user-select:none;filter:drop-shadow(0 4px 0 #17213b);animation:bob .8s infinite alternate}.target:active{transform:scale(.8)}@keyframes bob{to{margin-top:-12px}}.mission{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:90%;text-align:center;font-size:clamp(18px,4vw,30px);font-weight:1000;text-shadow:0 2px #fff}.controls{width:min(900px,100%);display:flex;gap:8px;margin-top:9px}.btn{flex:1;border:3px solid #17213b;border-radius:18px;background:#ffdc42;padding:11px;font-size:18px;font-weight:1000;box-shadow:0 4px 0 #17213b}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #17213b}.pop{position:absolute;font-size:30px;font-weight:1000;pointer-events:none;animation:pop .7s forwards}@keyframes pop{to{transform:translateY(-80px) scale(1.5);opacity:0}}.overlay{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:5}.card{background:#fff;border:4px solid #17213b;border-radius:28px;padding:22px;text-align:center;width:min(420px,90%);box-shadow:0 8px 0 #17213b}.card h1{margin:0;font-size:34px}.hidden{display:none}.stars{font-size:32px}
.city{position:absolute;inset:0;pointer-events:none}.sun{position:absolute;width:76px;height:76px;border-radius:50%;right:7%;top:8%;background:radial-gradient(circle at 35% 35%,#fff8ae,#ffc83d 58%,#ff9e2c);box-shadow:0 0 34px #ffd44f}.bldg{position:absolute;bottom:39%;border:4px solid #17213b;border-bottom:0;border-radius:8px 8px 0 0;background:linear-gradient(135deg,#ff8b73,#ff5f7f)}.bldg:after{content:"";position:absolute;inset:15% 17%;background:repeating-linear-gradient(90deg,#c9f4ff 0 15px,transparent 15px 27px),repeating-linear-gradient(0deg,#c9f4ff 0 13px,transparent 13px 25px)}.b1{left:4%;width:18%;height:34%}.b2{left:29%;width:20%;height:25%;background:linear-gradient(135deg,#7f7cff,#5d5bd3)}.b3{right:3%;width:22%;height:31%;background:linear-gradient(135deg,#ffca4c,#ff9f43)}.tree{position:absolute;bottom:32%;width:26px;height:72px;background:#7a4c2b;border:4px solid #17213b;border-radius:8px}.tree:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#39b86d;border:4px solid #17213b;left:-27px;top:-48px;box-shadow:22px 9px 0 #2e9f5c,-19px 12px 0 #55cf7f}.t1{left:23%}.t2{right:24%}.blessing{width:118px;height:164px;font-size:0;filter:drop-shadow(0 7px 5px #0003);z-index:3}.blessing svg{width:100%;height:100%;overflow:visible}.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#65c6ff,#37a6e8);clip-path:polygon(0 32%,100% 0,100% 100%,0 100%);opacity:.9;pointer-events:none}.name,.mission,.target{z-index:4}.target{background:#fff;border:4px solid #17213b;border-radius:50%;width:68px;height:68px;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #17213b,0 12px 22px #0003}.pill{background:linear-gradient(#fff,#f6fbff)}.btn{background:linear-gradient(#ffe96a,#ffcb38)}
</style></head><body><div class="game"><div class="top"><div class="pill">⭐ <span id="stars">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 LV <span id="level">1</span></div></div><div class="stage" id="stage"><div class="sky"></div><div class="city"><span class="bldg b1"></span><span class="bldg b2"></span><span class="bldg b3"></span><span class="tree t1"></span><span class="tree t2"></span><span class="sun"></span></div><div class="mission" id="mission">Help Blessing collect 8 stars!</div><div class="blessing" id="blessing" aria-label="Blessing"><svg viewBox="0 0 130 180" role="img"><ellipse cx="65" cy="169" rx="42" ry="8" fill="#000" opacity=".18"/><path d="M38 88 Q65 72 92 88 L101 145 Q66 162 29 145Z" fill="#ff5f7f"/><path d="M48 143 L43 170 L58 170 L65 145 L72 170 L88 170 L81 143Z" fill="#254b87"/><circle cx="65" cy="59" r="33" fill="#8e542f"/><path d="M31 55 Q35 17 66 17 Q101 18 100 58 Q87 36 65 37 Q44 36 31 55Z" fill="#1c1716"/><circle cx="53" cy="60" r="4" fill="#161616"/><circle cx="77" cy="60" r="4" fill="#161616"/><path d="M55 75 Q65 82 76 75" fill="none" stroke="#451f18" stroke-width="4" stroke-linecap="round"/><path d="M35 100 Q17 112 21 130" fill="none" stroke="#8e542f" stroke-width="11" stroke-linecap="round"/><path d="M94 99 Q112 111 109 130" fill="none" stroke="#8e542f" stroke-width="11" stroke-linecap="round"/><path d="M42 171 h17" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M72 171 h18" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg></div><div class="name">BLESSING ✨</div><div class="overlay" id="start"><div class="card"><h1>✨ Blessing's Block Party ✨</h1><p>Run around the block, tap the goodies, dodge the silly stuff, and unlock new challenges!</p><div class="stars">⭐🎈🛴🎵</div><button class="btn" onclick="startGame()">LET'S STEP!</button></div></div></div><div class="controls"><button class="btn" onclick="boost()">⚡ DASH</button><button class="btn" onclick="dance()">🕺🏾 DANCE</button><button class="btn" onclick="newRound()">🎲 NEW MISSION</button></div></div>
<script>
let stars=+(localStorage.lsStars||0),streak=0,level=+(localStorage.lsLevel||1),hits=0,timer=null;const stage=document.getElementById('stage'),blessing=document.getElementById('blessing');const goodies=['⭐','🎈','🪁','⚽','🍉','🎵','🛴','🧩'];const silly=['🧦','🥦','💦'];
function ui(){document.getElementById('stars').textContent=stars;document.getElementById('streak').textContent=streak;document.getElementById('level').textContent=level;localStorage.lsStars=stars;localStorage.lsLevel=level}
function startGame(){document.getElementById('start').classList.add('hidden');newRound()}
function spawn(){document.querySelectorAll('.target').forEach(x=>x.remove());let bad=Math.random()<.25,el=document.createElement('div');el.className='target';el.textContent=(bad?silly:goodies)[Math.floor(Math.random()*(bad?silly.length:goodies.length))];el.style.left=(25+Math.random()*65)+'%';el.style.top=(18+Math.random()*48)+'%';el.onclick=e=>hit(e,el,bad);stage.appendChild(el);timer=setTimeout(spawn,Math.max(650,1450-level*70))}
function hit(e,el,bad){clearTimeout(timer);if(bad){streak=0;pop(e.clientX,e.clientY,'😜 OOPS!');blessing.style.transform='rotate(-12deg)'}else{stars++;hits++;streak++;pop(e.clientX,e.clientY,streak>2?'🔥 NICE!':'⭐ +1');blessing.style.transform='scale(1.15)';if(hits>=8){level++;hits=0;celebrate()}}ui();setTimeout(()=>blessing.style.transform='',180);el.remove();spawn()}
function pop(x,y,t){let p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=(x-35)+'px';p.style.top=(y-25)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),700)}
function celebrate(){document.getElementById('mission').textContent='🎉 BLESSING LEVELED UP! LEVEL '+level+'!';for(let i=0;i<12;i++)setTimeout(()=>pop(Math.random()*innerWidth,innerHeight*.55,'✨'),i*60);setTimeout(()=>document.getElementById('mission').textContent='Level '+level+': Grab 8 goodies. Dodge the silly stuff!',1200)}
function newRound(){clearTimeout(timer);hits=0;document.getElementById('mission').textContent='Level '+level+': Help Blessing grab 8 goodies!';spawn()}
function boost(){blessing.style.left='55%';setTimeout(()=>blessing.style.left='9%',500)}function dance(){blessing.animate([{transform:'rotate(-15deg)'},{transform:'rotate(15deg) scale(1.2)'},{transform:'rotate(-15deg)'},{transform:'rotate(0)'}],{duration:650});stars++;ui()}ui();
</script></body></html>
