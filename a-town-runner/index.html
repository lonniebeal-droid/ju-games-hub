<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>A-TOWN RUNNER</title><style>body{margin:0;background:#09090f;color:white;font:16px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:14px}h1{color:#ff2d95}#road{height:62vh;min-height:430px;background:linear-gradient(#241b3b,#111 45%);position:relative;overflow:hidden;border-radius:18px;border:2px solid #333}.lane{position:absolute;top:0;bottom:0;width:2px;background:#555;opacity:.5}.l1{left:33%}.l2{left:66%}#p,.o{position:absolute;width:56px;height:72px;border-radius:12px;left:calc(50% - 28px);bottom:24px;background:#ff2d95;display:grid;place-items:center;font-size:30px}.o{bottom:auto;background:#d4af37;color:#111}.hud{display:flex;justify-content:space-between}.ctrl{display:flex;gap:12px;justify-content:center;margin:12px}button{font-size:22px;padding:12px 25px;background:#222;color:#fff;border:1px solid #555;border-radius:12px}</style><style>
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[role="button"],a{touch-action:manipulation}
button{min-height:44px;min-width:44px}
</style><style>
@media(max-width:700px){body{overscroll-behavior:none}button,[role="button"],a{font-size:max(16px,1em)}canvas{max-width:100%;height:auto}*{box-sizing:border-box}}
</style></head><body><main><h1>A-TOWN RUNNER</h1><div class=hud><b>Score <span id=s>0</span></b><b>Best <span id=b>0</span></b></div><div id=road><i class="lane l1"></i><i class="lane l2"></i><div id=p>🏃🏾</div></div><div class=ctrl><button onclick=move(-1)>◀</button><button onclick=start()>START</button><button onclick=move(1)>▶</button></div><p>Dodge traffic. Arrow keys or buttons.</p></main><script>let lane=1,run=0,score=0,obs=[],timer,last=0;let best=+localStorage.runnerBest||0;b.textContent=best;function pos(){p.style.left=['8%','calc(50% - 28px)','calc(92% - 56px)'][lane]}function move(d){lane=Math.max(0,Math.min(2,lane+d));pos()}onkeydown=e=>{if(e.key=='ArrowLeft')move(-1);if(e.key=='ArrowRight')move(1)};function start(){if(run)return;run=1;score=0;obs.forEach(x=>x.el.remove());obs=[];last=performance.now();requestAnimationFrame(loop)}function spawn(){let l=Math.floor(Math.random()*3),el=document.createElement('div');el.className='o';el.textContent='🚗';el.style.left=['8%','calc(50% - 28px)','calc(92% - 56px)'][l];el.style.top='-80px';road.appendChild(el);obs.push({el,l,y:-80})}function loop(t){if(!run)return;let dt=Math.min(32,t-last);last=t;if(Math.random()<dt/850)spawn();for(let o of obs){o.y+=dt*(.18+score/120000);o.el.style.top=o.y+'px';if(o.y>road.clientHeight-110&&o.y<road.clientHeight-25&&o.l==lane){run=0;best=Math.max(best,Math.floor(score));localStorage.runnerBest=best;b.textContent=best;alert('Run over. Score '+Math.floor(score));return}}obs=obs.filter(o=>{if(o.y>road.clientHeight){o.el.remove();return false}return true});score+=dt/12;s.textContent=Math.floor(score);requestAnimationFrame(loop)}pos()</script><script>
(function(){
 const fire=(key)=>window.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));
 const map={ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',' ':' '};
 document.querySelectorAll('button').forEach(b=>{
   const t=(b.textContent||'').toLowerCase();
   let k=t.includes('left')?'ArrowLeft':t.includes('right')?'ArrowRight':(t.includes('jump')||t.includes('start'))?' ':null;
   if(k){ b.addEventListener('pointerdown',e=>{e.preventDefault();fire(k)},{passive:false}); }
 });
})();
</script><script>
(function(){
 document.addEventListener('contextmenu',e=>{if(e.target.closest('button,[role="button"],canvas'))e.preventDefault()});
 document.querySelectorAll('button,[role="button"]').forEach(el=>{
   el.setAttribute('tabindex',el.getAttribute('tabindex')||'0');
   el.addEventListener('touchend',()=>{}, {passive:true});
 });
})();
</script></body></html>
